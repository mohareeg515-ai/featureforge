[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "featureforge"
version = "0.1.0"
description = "Automated ML feature store and data pipeline platform (DuckDB, Polars, Prefect, AWS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "polars>=2.1,<3",
  "duckdb>=2.0,<3",
  "pyarrow>=26,<27",
  "numpy>=2.0",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pandera[polars]>=0.36,<0.37",
  "prefect==3.9.4",
  "boto3>=1.40",
  "pyyaml>=6",
  "scikit-learn>=1.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50"]
real-data = ["fastexcel>=0.14"]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=2.4", "moto[s3]>=5.1", "types-PyYAML", "boto3-stubs[s3]", "python-hcl2>=7", "streamlit>=1.50"]

[project.scripts]
featureforge = "featureforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/featureforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: multi-component tests using the local filesystem",
  "e2e: full local end-to-end tests",
  "prefect: tests that run a real Prefect flow (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501", "RUF005", "E702", "E731", "B018", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/featureforge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandera.*", "sklearn.*", "prefect.*", "duckdb.*", "streamlit.*", "hcl2.*"]
ignore_missing_imports = true
follow_imports = "skip"
